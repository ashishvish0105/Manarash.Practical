
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1>{{ editMode?'Edit':'Add' }} Dock</h1>
  <button class="btn btn-primary mb-3" (click)="backToList()">Back to
    List</button>
</div>
<div class="row">
  <div class="col-6 mx-auto border p-4 mt-5 rounded shadow-sm">
    <form [formGroup]="dockForm">
      <div class="mb-3">
        <label for="Name" class="form-label">Name</label>
        <input type="text" class="form-control" formControlName="name" id="Name"
          placeholder="Enter Name">
        @if (dockForm.get('name')?.touched && dockForm.get('name')?.invalid) {
        <span class="text-danger">Name is required</span>
        }
      </div>
      <div class="mb-3">
        <label for="Type" class="form-label">Type</label>
        <select id="Type" class="form-select" formControlName="type">
          <option value="null" selected disabled>Select Type</option>
          @for (item of typeOptions; track $index) {
          <option [value]="item"
            [selected]="dockForm.get('type')?.value === item">{{ item
            }}</option>
          }
        </select>
        @if (dockForm.get('type')?.touched && dockForm.get('type')?.invalid) {
        <span class="text-danger">Type is required</span>
        }
      </div>
      <div class="form-check form-switch">
        <label class="form-check-label" for="Active">Active</label>
        <input class="form-check-input" type="checkbox" id="Active"
          [checked]="dockForm.get('isActive')?.value == true ? true : false"
          formControlName="isActive">
      </div>
      <button type="button" class="mt-4 btn btn-primary"
        (click)="onSubmit()">Submit</button>
    </form>

  </div>
</div>
