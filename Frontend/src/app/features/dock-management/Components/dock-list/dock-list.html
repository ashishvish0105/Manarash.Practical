<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="display-6 mb-4">Dock List</h1>
  <button class="btn btn-primary mb-3" (click)="addDock()">Add Dock</button>
</div>

<table class="table table-striped table-bordered align-middle">
  <thead>
    <tr>
      <th scope="col" style="width: 10%;"># ID</th>
      <th scope="col">Dock Name</th>
      <th scope="col">Dock Code</th>
      <th scope="col" style="width: 15%;">Status</th>
      <th scope="col" style="width: 20%;" class="text-center">Actions</th>
    </tr>
  </thead>
  <tbody>
    @for (dock of docksList(); track dock.dockId; let i = $index) {
    <tr>
      <th scope="row">{{ dock.dockId }}</th>
      <td>{{ dock.name }}</td>
      <td>{{ getDockTypeName(dock.typeId) }}</td>
      <td>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="Active"
            [checked]="dock.isActive"
            (change)="changeIsActive(dock)">
        </div>
      </td>
      <td class="text-center">
        <button class="btn btn-sm btn-outline-secondary me-2"
          (click)="editDock(dock.dockId)">
          Edit
        </button>
        <button class="btn btn-sm btn-outline-danger"
          (click)="deleteDock(dock.dockId)">
          Delete
        </button>
      </td>
    </tr>
    } @empty {
    <tr>
      <td colspan="5" class="text-center text-muted py-4">
        No docks available in the system.
      </td>
    </tr>
    }
  </tbody>
</table>
